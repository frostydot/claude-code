<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>Photos</title>
<style>
/* =========================================================================
   Photos — a single consistent art style is shared by every tab & surface:
   same font, same spacing scale, same radii, same icon set, same motion.

   Visual language: dark glass surfaces, a blue/green/gold accent trio, and
   emoji glyphs for every icon — modeled on a reference app's look, ported
   over onto this app's own (more capable) persistence/thumbnail/gesture
   engine underneath. See README for what was and wasn't carried over.
   ========================================================================= */

:root {
  --bg-primary: #0c0c0e;
  --bg-elevated: #1e1e23;
  --bg-tile: #17171a;
  --bg-surf3: #252529;
  --text-primary: #e8e8ec;
  --text-secondary: rgba(232, 232, 236, 0.42);
  --accent: #4f8aff;
  --accent2: #7b5ea7;
  --danger: #ff5f5f;
  --favorite: #ffcc00;
  --folder-accent: #3ecf8e;
  --border: rgba(255, 255, 255, 0.07);
  --border2: rgba(255, 255, 255, 0.13);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 20px 60px rgba(0, 0, 0, 0.65);
  --blur-bg: rgba(12, 12, 14, 0.93);
  --panel-bg: rgba(22, 22, 28, 0.96);
  --overlay-scrim: rgba(0, 0, 0, 0.72);
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;

  --radius-sm: 9px;
  --radius-md: 14px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 48px;

  --ease: cubic-bezier(0.22, 0.68, 0, 1.1);
  --tabbar-h: 82px;
  --topbar-h: 56px;
}

* { box-sizing: border-box; }

/* Author rules below set `display` on several of these elements (flex/grid),
   which would otherwise out-rank the UA [hidden] stylesheet rule and defeat
   toggling visibility via the `hidden` attribute. Force it to always win. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  margin: 0;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Emoji icons everywhere — one consistent glyph per concept, no separate
   icon set to keep in sync. Sized via font-size on the element that hosts
   them (buttons, badges, empty states) rather than a shared class. */
.emoji-icon { font-style: normal; line-height: 1; }

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 900px;
  margin: 0 auto;
  position: relative;
}

/* ---------------------------- Top bar ---------------------------------- */

.topbar {
  height: var(--topbar-h);
  padding: 0 var(--space-md);
  padding-top: env(safe-area-inset-top);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--blur-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 20;
  position: relative;
  gap: var(--space-sm);
}

.topbar-title-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex-shrink: 1;
}

.topbar-logo {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 8px;
  font-size: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 4px 12px rgba(79, 138, 255, 0.26);
  display: flex;
  align-items: center;
  justify-content: center;
}

.topbar h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }

.icon-btn {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border2);
  font-size: 15px;
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.1s var(--ease);
  color: var(--text-primary);
}
.icon-btn:active { transform: scale(0.92); background: var(--bg-tile); }
.icon-btn.hidden-btn { display: none; }
.icon-btn.on { background: rgba(79, 138, 255, 0.18); border-color: var(--accent); box-shadow: 0 0 0 1px rgba(79, 138, 255, 0.3); }

.text-btn {
  color: var(--accent);
  font-size: 13.5px;
  font-weight: 600;
  padding: 0 11px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  white-space: nowrap;
}
.text-btn:active { opacity: 0.7; }
.text-btn.hidden-btn { display: none; }
#selectAllBtn { background: transparent; border-color: transparent; color: var(--accent); }

/* --------------------------- Status bar ---------------------------------- */

.status-bar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin: 10px var(--space-md) 0;
  padding: 9px 13px;
  background: var(--bg-tile);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--text-secondary);
  flex-shrink: 0;
  min-height: 40px;
}
.status-text { flex: 1; }
.status-badge {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border2);
  border-radius: var(--radius-pill);
  color: var(--text-secondary);
  white-space: nowrap;
}

/* ---------------------------- Settings panel ------------------------------ */

.settings-wrap { position: relative; }

.settings-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  width: 260px;
  max-height: 72vh;
  overflow-y: auto;
  background: var(--panel-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border2);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 8px;
  z-index: 210;
  animation: popIn 0.16s var(--ease) both;
}

.settings-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-secondary);
  padding: 10px 8px 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.settings-title:first-child { padding-top: 4px; }

.segmented {
  display: flex;
  gap: 4px;
  padding: 4px 4px 8px;
}
.segmented-btn {
  flex: 1;
  padding: 7px 4px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: var(--bg-tile);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
  transition: background 0.12s var(--ease), color 0.12s var(--ease), border-color 0.12s var(--ease);
}
.segmented-btn.active {
  background: rgba(79, 138, 255, 0.18);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  padding: 9px 8px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
}
.settings-row:active { background: rgba(255, 255, 255, 0.04); }

.toggle { position: relative; width: 40px; height: 24px; flex-shrink: 0; }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute;
  inset: 0;
  background: var(--bg-tile);
  border: 1px solid var(--border2);
  border-radius: var(--radius-pill);
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
}
.toggle-knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transition: transform 0.2s var(--ease), background 0.2s var(--ease);
}
.toggle input:checked ~ .toggle-track { background: var(--accent); border-color: var(--accent); }
.toggle input:checked ~ .toggle-knob { transform: translateX(16px); background: #fff; }

.settings-action {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  width: 100%;
  padding: 10px 8px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-primary);
}
.settings-action:active { background: rgba(255, 255, 255, 0.05); }
.settings-action .emoji-icon { font-size: 14px; width: 20px; text-align: center; opacity: 0.85; flex-shrink: 0; }

.settings-hint {
  margin: 4px 0 0;
  padding: 8px 8px 2px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
}

/* ---------------------------- Main content ------------------------------ */

#content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.view {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--space-md) var(--space-md) calc(var(--tabbar-h) + var(--space-lg));
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
}
.view.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

/* --------------------------- Photo/video grid --------------------------- */

.tile-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}
/* Grid density, adjustable via Settings → Display (defaults to Medium = the
   original 3-across). Column count, not a fixed px size, so it stays
   responsive at every screen width the same way the default already was. */
.tile-grid[data-grid="2"] { grid-template-columns: repeat(2, 1fr); }
.tile-grid[data-grid="3"] { grid-template-columns: repeat(3, 1fr); }
.tile-grid[data-grid="4"] { grid-template-columns: repeat(4, 1fr); }

.tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-tile);
  border: 2.5px solid transparent;
  animation: tileIn 0.28s var(--ease) both;
  /* Offscreen tiles skip layout/paint entirely — on a huge grid this cuts
     rendering work to roughly what's actually on screen. contain-intrinsic-size
     just needs to be in the right ballpark since aspect-ratio governs the
     real size once a tile is (or becomes) visible. */
  content-visibility: auto;
  contain-intrinsic-size: auto 140px;
}
.tile.selected { border-color: var(--accent); }

@keyframes tileIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

/* A soft shimmer placeholder shows behind every tile until its thumbnail is
   ready, so the grid never looks broken while thumbnails generate lazily. */
.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--bg-tile) 25%, var(--bg-elevated) 50%, var(--bg-tile) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}
.tile:has(.tile-thumb.loaded)::before,
.tile:has(.thumb-fallback)::before { display: none; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Thumbnails fade in once their lazily-generated preview lands, rather than
   popping in — and sit on the --bg-tile placeholder color until then. */
.tile-thumb {
  opacity: 0;
  transition: opacity 0.22s var(--ease);
}
.tile-thumb.loaded { opacity: 1; }

/* Shown in the rare case a still frame genuinely can't be captured (corrupt
   or unsupported file) instead of leaving a tile blank forever. */
.thumb-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-tile);
  color: var(--text-secondary);
  font-size: 34px;
  opacity: 0.5;
  animation: fadeUp 0.3s var(--ease) both;
}

.tile .video-badge {
  position: absolute;
  left: var(--space-xs);
  bottom: var(--space-xs);
  display: flex;
  align-items: center;
  gap: 3px;
  background: rgba(123, 94, 167, 0.88);
  color: #fff;
  padding: 3px 7px 3px 5px;
  border-radius: var(--radius-pill);
  font-size: 10.5px;
  font-weight: 600;
  font-family: var(--mono);
  backdrop-filter: blur(6px);
}
.tile .video-badge .emoji-icon { font-size: 10px; }

.tile .dup-badge {
  position: absolute;
  right: var(--space-xs);
  bottom: var(--space-xs);
  background: rgba(255, 95, 95, 0.88);
  color: #fff;
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  backdrop-filter: blur(6px);
}

.tile .fav-btn {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.2s var(--ease), transform 0.15s var(--ease);
}
.tile:hover .fav-btn, .tile.is-favorite .fav-btn { opacity: 1; }
.tile.is-favorite .fav-btn { color: var(--favorite); }
.tile .fav-btn:active { transform: scale(0.85); }

.tile .menu-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.2s var(--ease), transform 0.15s var(--ease);
}
.tile:hover .menu-btn, .tile.menu-open .menu-btn { opacity: 1; }
.tile .menu-btn:active { transform: scale(0.85); }

@media (hover: none) {
  .tile .fav-btn, .tile .menu-btn { opacity: 1; }
}

/* ------------------------------- Select mode ------------------------------ */

.select-indicator {
  display: none;
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.75);
  background: rgba(0, 0, 0, 0.32);
  align-items: center;
  justify-content: center;
  color: transparent;
  font-size: 11px;
  font-weight: 700;
  backdrop-filter: blur(4px);
  transition: background 0.12s var(--ease), border-color 0.12s var(--ease);
}
.tile.selected .select-indicator {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

body.select-mode .tile .fav-btn,
body.select-mode .tile .menu-btn { display: none; }
body.select-mode .tile .select-indicator { display: flex; }

.tile.selected::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(79, 138, 255, 0.14);
  pointer-events: none;
}

/* ------------------------------ Empty state ------------------------------ */

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-xl) var(--space-lg);
  min-height: 50vh;
  color: var(--text-secondary);
  animation: fadeUp 0.35s var(--ease) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
.empty-state .emoji-icon {
  font-size: 52px;
  opacity: 0.28;
  margin-bottom: var(--space-md);
  display: block;
}
.empty-state h3 {
  margin: 0 0 var(--space-xs);
  font-size: 16px;
  font-weight: 500;
  color: var(--text-primary);
  opacity: 0.85;
}
.empty-state p {
  margin: 0 0 var(--space-md);
  font-size: 13px;
  max-width: 280px;
  line-height: 1.55;
  color: var(--text-secondary);
}
.empty-state .btn-primary { margin-top: var(--space-sm); }

/* -------------------------------- Buttons -------------------------------- */

.btn-primary {
  background: var(--accent);
  color: #fff;
  padding: 12px 26px;
  border-radius: var(--radius-md);
  font-weight: 500;
  font-size: 15px;
  box-shadow: 0 4px 20px rgba(79, 138, 255, 0.22);
  transition: opacity 0.15s var(--ease), transform 0.1s var(--ease);
}
.btn-primary:active { opacity: 0.85; transform: scale(0.98); }

/* -------------------------------- Tab bar --------------------------------- */

.tabbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(12, 12, 14, 0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 20;
}

.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 2px 3px;
  min-height: 58px;
  color: var(--text-secondary);
  transition: color 0.15s var(--ease);
}
.tab-btn .emoji-icon { font-size: 20px; }
.tab-btn span { font-size: 10px; font-weight: 500; letter-spacing: 0.01em; }
.tab-btn.active { color: var(--accent); }
.tab-btn[data-tab="favorites"].active { color: var(--favorite); }

/* Selection action bar reuses .tab-btn styling for its 3 buttons */
.tab-btn:disabled { opacity: 0.3; pointer-events: none; }
.tab-btn.danger-tab { color: var(--danger); }
.tab-btn.folder-tab { color: var(--folder-accent); }
.tab-btn.is-favorite { color: var(--favorite); }

/* -------------------------------- Folders --------------------------------- */

.folder-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.folder-card {
  position: relative;
  background: linear-gradient(165deg, var(--bg-surf3), var(--bg-tile));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 10px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background 0.12s var(--ease), border-color 0.12s var(--ease), transform 0.1s var(--ease);
  animation: tileIn 0.28s var(--ease) both;
}
.folder-card:active { background: var(--bg-elevated); border-color: var(--border2); transform: scale(0.97); }

.folder-menu-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 14px;
  transition: background 0.1s var(--ease);
}
.folder-menu-btn:active { background: rgba(0, 0, 0, 0.55); }

.folder-fan {
  position: relative;
  width: 100%;
  height: 100px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.folder-fan .fan-card {
  position: absolute;
  width: 76px;
  height: 76px;
  border-radius: 15px;
  overflow: hidden;
  background: var(--bg-elevated);
  border: 3px solid var(--bg-surf3);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
  transform-origin: center center;
  /* deck spread — cards fanned out like a hand of cards, position set via JS */
  transform: rotate(var(--rot, 0deg)) translate(var(--dx, 0px), 0);
}
.folder-fan .fan-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.25s var(--ease);
}
.folder-fan .fan-card img.loaded { opacity: 1; }

.folder-icon-empty {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 34px;
  opacity: 0.5;
}

.folder-name {
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.folder-count {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-family: var(--mono);
}

/* --------------------------- Folder detail view ---------------------------- */

.back-btn {
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--accent);
  font-size: 15px;
  font-weight: 500;
  padding: var(--space-xs) 0;
  margin-bottom: var(--space-xs);
}
.back-btn .emoji-icon { font-size: 17px; }
.back-btn:active { opacity: 0.6; }

.folder-detail-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 var(--space-md);
}

/* -------------------------------- Lightbox --------------------------------- */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(7, 7, 9, 0.97);
  z-index: 100;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  animation: fadeIn 0.2s var(--ease) both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.lightbox-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  transition: opacity 0.16s var(--ease);
}
.icon-btn.light { background: var(--bg-elevated); border-color: var(--border); color: #fff; }
.icon-btn.light.is-favorite { color: var(--favorite); border-color: rgba(255, 204, 0, 0.4); background: rgba(255, 204, 0, 0.08); }
.icon-btn.light.on { background: rgba(79, 138, 255, 0.18); border-color: var(--accent); color: var(--accent); }
.lightbox-counter { color: var(--text-secondary); font-size: 12px; font-family: var(--mono); }
.lightbox-header-actions { display: flex; gap: 5px; }

.lightbox-stage {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: pan-y;
}
.lightbox-media {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: mediaIn 0.22s var(--ease) both;
}
@keyframes mediaIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
.lightbox-media img, .lightbox-media video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: var(--radius-sm);
}

/* Pinch-to-zoom / pan target — see the pointer-driven zoom controller in
   app.js. transform is written imperatively as translate3d(...) scale(...);
   this just establishes the baseline and lets the controller add a
   transition only when it wants an animated settle. */
.lightbox-media img.zoomable {
  touch-action: none;
  cursor: zoom-in;
  transform-origin: center center;
}
.lightbox-media img.zoomable.is-zoomed { cursor: grab; }

/* "the interface instantly melts away" — chrome fades out while zoomed */
.lightbox.zoomed .lightbox-header,
.lightbox.zoomed .lightbox-footer,
.lightbox.zoomed .lightbox-nav {
  opacity: 0;
  pointer-events: none;
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: #fff;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s var(--ease), transform 0.15s var(--ease);
}
.lightbox-nav:active { transform: translateY(-50%) scale(0.9); }
.lightbox-nav.prev { left: var(--space-sm); }
.lightbox-nav.next { right: var(--space-sm); }
.lightbox-nav:disabled { opacity: 0.25; pointer-events: none; }
@media (max-width: 640px) {
  .lightbox-nav { display: none; }
}

.zoom-hud {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(12px);
  color: #fff;
  font-family: var(--mono);
  font-size: 12px;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s var(--ease);
  z-index: 4;
  white-space: nowrap;
}
.zoom-hud.vis { opacity: 1; }

/* Fullscreen (native, via requestFullscreen) falls back to this CSS-only
   "cinema" mode when the platform doesn't support/allow requesting
   fullscreen on an arbitrary element (notably iOS Safari). Either way the
   chrome hides completely and an explicit exit pill appears, since there's
   no OS-level fullscreen indicator to rely on in the fallback case. */
.lightbox.cinema .lightbox-header,
.lightbox.cinema .lightbox-footer {
  opacity: 0;
  pointer-events: none;
}
.cinema-exit {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(12px);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 22px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  gap: 7px;
  z-index: 5;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  animation: fadeUp 0.25s var(--ease) both;
  white-space: nowrap;
}

.lightbox-footer {
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  transition: opacity 0.16s var(--ease);
}
.lightbox-name {
  color: var(--text-secondary);
  font-size: 11.5px;
  font-family: var(--mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.lightbox-meta { color: var(--text-secondary); font-size: 11.5px; font-family: var(--mono); flex-shrink: 0; }

/* ------------------------------ Context menu -------------------------------- */

.context-menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 199;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

.context-menu {
  position: fixed;
  z-index: 200;
  background: var(--bg-elevated);
  border: 1px solid var(--border2);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 6px;
  min-width: 210px;
  animation: popIn 0.16s var(--ease) both;
}
@keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* The two most common actions — Favourite and Move to Folder — get a big
   2-up icon-grid row up top, one tap away; everything else is a compact
   list below. */
.context-menu-big-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 4px 4px 8px;
}
.context-menu-big {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 16px 8px;
  border-radius: 14px;
  background: var(--bg-tile);
  border: 1px solid var(--border2);
  color: var(--text-primary);
  transition: background 0.12s var(--ease), border-color 0.12s var(--ease), transform 0.1s var(--ease);
}
.context-menu-big:active { background: var(--bg-surf3); transform: scale(0.97); }
.context-menu-big .emoji-icon { font-size: 22px; }
.context-menu-big span:last-child { font-size: 12.5px; font-weight: 600; text-align: center; }
.context-menu-big.folder-accent { border-color: rgba(62, 207, 142, 0.35); background: rgba(62, 207, 142, 0.1); color: var(--folder-accent); }
.context-menu-big.folder-accent:active { background: rgba(62, 207, 142, 0.18); }
.context-menu-big.is-favorite { border-color: rgba(255, 204, 0, 0.4); background: rgba(255, 204, 0, 0.1); color: var(--favorite); }
.context-menu-big.is-favorite:active { background: rgba(255, 204, 0, 0.18); }

.context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

.context-menu button.context-menu-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
}
.context-menu button.context-menu-row:active { background: rgba(255, 255, 255, 0.08); }
.context-menu button.context-menu-row .emoji-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.context-menu button.context-menu-row.danger { color: var(--danger); }

/* -------------------------------- Info sheet --------------------------------- */

.info-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  z-index: 209;
  animation: fadeIn 0.2s var(--ease) both;
}
.info-sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 210;
  display: flex;
  justify-content: center;
  padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
}
.info-sheet-inner {
  width: min(420px, calc(100vw - 32px));
  background: var(--bg-elevated);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-lg) var(--space-lg);
  box-shadow: var(--shadow-md);
  animation: sheetUp 0.22s var(--ease) both;
  margin: 0 16px;
}
@keyframes sheetUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.info-sheet-handle {
  width: 36px;
  height: 5px;
  border-radius: var(--radius-pill);
  background: var(--border2);
  margin: var(--space-sm) auto var(--space-md);
}
.info-sheet h3 {
  margin: 0 0 var(--space-md);
  font-size: 17px;
  font-weight: 700;
  word-break: break-word;
}
.info-sheet dl {
  margin: 0 0 var(--space-lg);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-sm) var(--space-md);
}
.info-sheet dt { color: var(--text-secondary); font-size: 13px; }
.info-sheet dd { margin: 0; font-size: 13px; font-weight: 500; text-align: right; font-family: var(--mono); }
.info-sheet .btn-primary { width: 100%; text-align: center; }

/* -------------------------------- Form controls -------------------------------- */

.text-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg-tile);
  color: var(--text-primary);
  font: inherit;
  font-size: 16px;
  margin: 0 0 var(--space-lg);
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.text-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79, 138, 255, 0.18);
}

.btn-secondary {
  background: var(--bg-tile);
  color: var(--text-primary);
  border: 1px solid var(--border2);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-weight: 500;
  font-size: 14px;
  transition: background 0.15s var(--ease);
}
.btn-secondary:active { background: var(--bg-surf3); }

.sheet-actions { display: flex; gap: var(--space-sm); }
.sheet-actions .btn-primary,
.sheet-actions .btn-secondary { flex: 1; text-align: center; }

/* --------------------------------- Move-to-folder list --------------------------------- */

.move-folder-list {
  max-height: 50vh;
  overflow-y: auto;
  margin: 0 0 var(--space-sm);
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: env(safe-area-inset-bottom);
}
.move-row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  width: 100%;
  padding: 11px var(--space-sm);
  border-radius: var(--radius-sm);
  font-size: 14px;
  text-align: left;
}
.move-row:active { background: rgba(255, 255, 255, 0.06); }
.move-row .emoji-icon { font-size: 14px; width: 19px; text-align: center; flex-shrink: 0; opacity: 0.85; }
.move-row span:not(.emoji-icon):not(.check) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.move-row .check { color: var(--accent); flex-shrink: 0; font-size: 13px; }
.move-row.danger { color: var(--danger); border-top: 1px solid var(--border); margin-bottom: 4px; }
.move-row.new-row { color: var(--accent); border-top: 1px solid var(--border); margin-top: 4px; }

/* -------------------------------- Toast ---------------------------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + var(--space-md) + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px);
  z-index: 400;
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: 9px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--border2);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  white-space: nowrap;
  max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.toast-text { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.toast-action {
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.toast-action:active { opacity: 0.6; }

/* -------------------------------- Scrollbars ---------------------------------- */

.view::-webkit-scrollbar { width: 0; }

/* -------------------------------- Responsive ------------------------------------ */

@media (min-width: 720px) {
  .tile-grid { gap: 6px; }
  .folder-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 360px) {
  .topbar h1 { font-size: 15px; }
  .settings-panel { width: 220px; }
  .folder-fan { height: 88px; }
  .folder-fan .fan-card { width: 64px; height: 64px; }
}

</style>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-title-wrap">
      <span class="topbar-logo emoji-icon" aria-hidden="true">📷</span>
      <h1 id="topbarTitle">Photos</h1>
    </div>
    <div class="topbar-actions">
      <button class="text-btn hidden-btn" id="selectAllBtn">Select All</button>
      <button class="text-btn hidden-btn" id="cancelSelectBtn">✕ Cancel</button>
      <button class="icon-btn" id="newFolderBtn" aria-label="New folder">
        <span class="emoji-icon">📁</span>
      </button>
      <button class="icon-btn" id="selectModeBtn" aria-label="Select items">
        <span class="emoji-icon">☑️</span>
      </button>
      <div class="settings-wrap">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <span class="emoji-icon">⚙️</span>
        </button>
        <div class="settings-panel" id="settingsPanel" hidden>
          <div class="settings-title">Display</div>
          <div class="segmented" id="gridSizeGroup">
            <button class="segmented-btn" data-grid="4">Small</button>
            <button class="segmented-btn active" data-grid="3">Medium</button>
            <button class="segmented-btn" data-grid="2">Large</button>
          </div>
          <div class="settings-title">Preferences</div>
          <label class="settings-row">
            <span>Sort by Date Taken</span>
            <span class="toggle"><input type="checkbox" id="prefExifToggle" checked><span class="toggle-track"></span><span class="toggle-knob"></span></span>
          </label>
          <label class="settings-row">
            <span>Mark Duplicates</span>
            <span class="toggle"><input type="checkbox" id="prefDupesToggle" checked><span class="toggle-track"></span><span class="toggle-knob"></span></span>
          </label>
          <div class="settings-title">Backup</div>
          <button class="settings-action" id="exportBackupBtn">
            <span class="emoji-icon">📤</span><span>Export Backup</span>
          </button>
          <button class="settings-action" id="importBackupBtn">
            <span class="emoji-icon">📥</span><span>Import Backup</span>
          </button>
          <p class="settings-hint">Backs up favourites and folders (not the photos/videos themselves) to a file you can re-import here, or on another device.</p>
        </div>
      </div>
      <button class="icon-btn" id="addFilesBtn" aria-label="Add photos or videos">
        <span class="emoji-icon">＋</span>
      </button>
    </div>
  </header>

  <div class="status-bar" id="statusBar" hidden>
    <span class="emoji-icon" aria-hidden="true">📂</span>
    <span class="status-text" id="statusText"></span>
    <span class="status-badge" id="statusBadge"></span>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
  <input type="file" id="backupImport" accept=".json" hidden>

  <main id="content">
    <section class="view grid-view active" data-view="all" id="view-all">
      <div class="tile-grid"></div>
      <div class="empty-state" hidden></div>
    </section>

    <section class="view grid-view" data-view="photos" id="view-photos">
      <div class="tile-grid"></div>
      <div class="empty-state" hidden></div>
    </section>

    <section class="view grid-view" data-view="videos" id="view-videos">
      <div class="tile-grid"></div>
      <div class="empty-state" hidden></div>
    </section>

    <section class="view grid-view" data-view="favorites" id="view-favorites">
      <div class="tile-grid"></div>
      <div class="empty-state" hidden></div>
    </section>

    <section class="view folders-view" data-view="folders" id="view-folders">
      <div class="folder-grid"></div>
      <div class="empty-state" hidden></div>
    </section>

    <section class="view grid-view" data-view="folder-detail" id="view-folder-detail">
      <button class="back-btn" id="folderBackBtn">
        <span class="emoji-icon">‹</span>
        <span>Folders</span>
      </button>
      <h2 class="folder-detail-title" id="folderDetailTitle"></h2>
      <div class="tile-grid"></div>
      <div class="empty-state" hidden></div>
    </section>
  </main>

  <nav class="tabbar" id="mainTabbar">
    <button class="tab-btn active" data-tab="all">
      <span class="emoji-icon">⊞</span>
      <span>All</span>
    </button>
    <button class="tab-btn" data-tab="photos">
      <span class="emoji-icon">🖼</span>
      <span>Photos</span>
    </button>
    <button class="tab-btn" data-tab="videos">
      <span class="emoji-icon">🎬</span>
      <span>Videos</span>
    </button>
    <button class="tab-btn" data-tab="favorites">
      <span class="emoji-icon">★</span>
      <span>Favourites</span>
    </button>
    <button class="tab-btn" data-tab="folders">
      <span class="emoji-icon">📁</span>
      <span>Folders</span>
    </button>
  </nav>

  <!-- Selection action bar — replaces the tab bar while Select mode is on -->
  <nav class="tabbar" id="selectActionBar" hidden>
    <button class="tab-btn" id="selectFavBtn" disabled>
      <span class="emoji-icon">★</span>
      <span data-select-fav-label>Favourite</span>
    </button>
    <button class="tab-btn folder-tab" id="selectMoveBtn" disabled>
      <span class="emoji-icon">📁</span>
      <span>Move</span>
    </button>
    <button class="tab-btn danger-tab" id="selectRemoveBtn" disabled>
      <span class="emoji-icon">🗑</span>
      <span>Remove</span>
    </button>
  </nav>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-header">
      <button class="icon-btn light" id="lightboxClose" aria-label="Close">
        <span class="emoji-icon">✕</span>
      </button>
      <span class="lightbox-counter" id="lightboxCounter"></span>
      <div class="lightbox-header-actions">
        <button class="icon-btn light" id="lightboxFullscreen" aria-label="Toggle fullscreen">
          <span class="emoji-icon">⛶</span>
        </button>
        <button class="icon-btn light" id="lightboxFav" aria-label="Toggle favourite">
          <span class="emoji-icon">☆</span>
        </button>
      </div>
    </div>
    <div class="lightbox-stage" id="lightboxStage">
      <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Previous">
        <span class="emoji-icon">‹</span>
      </button>
      <div class="lightbox-media" id="lightboxMedia"></div>
      <button class="lightbox-nav next" id="lightboxNext" aria-label="Next">
        <span class="emoji-icon">›</span>
      </button>
      <div class="zoom-hud" id="zoomHud">100%</div>
      <button class="cinema-exit" id="cinemaExit" hidden>
        <span class="emoji-icon">⊠</span><span>Exit Fullscreen</span>
      </button>
    </div>
    <div class="lightbox-footer">
      <div class="lightbox-name" id="lightboxName"></div>
      <div class="lightbox-meta" id="lightboxMeta"></div>
    </div>
  </div>

  <!-- Per-item context menu -->
  <div class="context-menu" id="contextMenu" hidden>
    <div class="context-menu-big-row">
      <button class="context-menu-big" data-action="move"><span class="emoji-icon">📁</span><span>Move to Folder</span></button>
      <button class="context-menu-big" data-action="favorite"><span class="emoji-icon">⭐</span><span data-fav-label>Favourite</span></button>
    </div>
    <div class="context-menu-divider"></div>
    <button class="context-menu-row" data-action="info"><span class="emoji-icon">ℹ️</span><span>Info</span></button>
    <div class="context-menu-divider"></div>
    <button class="context-menu-row danger" data-action="remove"><span class="emoji-icon">🗑️</span><span>Remove</span></button>
  </div>
  <div class="context-menu-backdrop" id="contextMenuBackdrop" hidden></div>

  <!-- Per-folder context menu -->
  <div class="context-menu" id="folderContextMenu" hidden>
    <button class="context-menu-row" data-action="rename"><span class="emoji-icon">✏️</span><span>Rename</span></button>
    <div class="context-menu-divider"></div>
    <button class="context-menu-row danger" data-action="delete"><span class="emoji-icon">🗑️</span><span>Delete Folder</span></button>
  </div>
  <div class="context-menu-backdrop" id="folderContextMenuBackdrop" hidden></div>

  <!-- Info panel -->
  <div class="info-sheet" id="infoSheet" hidden>
    <div class="info-sheet-inner">
      <div class="info-sheet-handle"></div>
      <h3 id="infoName"></h3>
      <dl id="infoList"></dl>
      <button class="btn-primary" id="infoClose">Done</button>
    </div>
  </div>
  <div class="info-sheet-backdrop" id="infoSheetBackdrop" hidden></div>

  <!-- New Folder / Rename Folder sheet -->
  <div class="info-sheet" id="folderNameSheet" hidden>
    <div class="info-sheet-inner">
      <div class="info-sheet-handle"></div>
      <h3 id="folderNameTitle">New Folder</h3>
      <input type="text" class="text-input" id="folderNameInput" placeholder="Folder name" maxlength="60" autocomplete="off">
      <div class="sheet-actions">
        <button class="btn-secondary" id="folderNameCancel">Cancel</button>
        <button class="btn-primary" id="folderNameCreate">Create</button>
      </div>
    </div>
  </div>
  <div class="info-sheet-backdrop" id="folderNameBackdrop" hidden></div>

  <!-- Move to Folder sheet -->
  <div class="info-sheet" id="moveSheet" hidden>
    <div class="info-sheet-inner">
      <div class="info-sheet-handle"></div>
      <h3>Move to Folder</h3>
      <div class="move-folder-list" id="moveFolderList"></div>
    </div>

<script>
(() => {
  'use strict';

  /* ==========================================================================

       nothing is or can be written to disk for these. No web page, in any
       browser or embedded WebView, can silently re-read files off your
       device without you explicitly picking them again — that's a browser
       security boundary, not a limitation of this app. Re-opening the app
       always means re-adding your photos/videos via "Add Photos & Videos".
     - Favourites, folders (the ones YOU create), and which item is in which
       folder are small JSON metadata, and DO persist automatically across
       app restarts — no action needed from you — via a layered store (see
       "Persistence" below): IndexedDB first, falling back to localStorage,
       falling back to in-memory-only if neither is available in whatever
       WebView is hosting the page. A folder only ever appears in the
       Folders tab while at least one of its items is currently loaded —
       re-add the same file later and it snaps straight back into the
       folder you put it in, because the id is stable (name + size +
       last-modified), regardless of which storage tier actually held it.
     - mediaItems is kept sorted newest-first (by lastModified) at all times,
       so every derived view (All/Photos/Videos/Favourites/Folders) inherits
       that order for free.
     ========================================================================== */

  const mediaItems = [];
  const mediaMap = new Map();

  // bottom of this file) fills these in asynchronously once the layered
  // store resolves. See "Persistence" below for why this has to be async,
  // and why nothing needs to wait on it.
  const favorites = new Set();
  let folders = [];          // [{ id, name }]
  let assignments = {};      // { itemId: folderId }

  let currentTab = 'all';
  let currentFolder = null; // folder id, while drilled into a folder's detail view

  let lightboxIndex = 0;

  let folderMenuTargetId = null;
  let moveSheetItemIds = [];

  let folderSheetAssignItemIds = null;

  const selectedIds = new Set();

  let prefExif = true;                // sort by EXIF date-taken when available, not just lastModified
  let prefDupes = true;               // show the DUP badge on name+size matches

  let toastHideTimer = null;
  let hudTimer = null;
  let pendingRemoval = null;          // { items: [{item, wasFav}], timer } — undo window before URLs are actually revoked

  const IMAGE_EXT = /\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?|avif)$/i;

  const fileInput = $('#fileInput');
  const addFilesBtn = $('#addFilesBtn');

  const selectModeBtn = $('#selectModeBtn');

  const lightboxMeta = $('#lightboxMeta');

  const lightboxPrev = $('#lightboxPrev');
  const lightboxNext = $('#lightboxNext');
  const lightboxFav = $('#lightboxFav');

  const infoSheet = $('#infoSheet');
  const infoSheetBackdrop = $('#infoSheetBackdrop');
  const infoName = $('#infoName');
  const infoList = $('#infoList');
  const infoClose = $('#infoClose');

  const folderNameSheet = $('#folderNameSheet');
  const folderNameBackdrop = $('#folderNameBackdrop');
  const folderNameTitle = $('#folderNameTitle');
  const folderNameInput = $('#folderNameInput');
  const folderNameCreate = $('#folderNameCreate');
  const folderNameCancel = $('#folderNameCancel');

  const moveSheet = $('#moveSheet');
  const moveSheetBackdrop = $('#moveSheetBackdrop');
  const moveFolderList = $('#moveFolderList');
